name: Build Mihadril APK

on:
  push:
    branches: [main]
    paths:
      - ".source-parts/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihadril-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev libltdl-dev ccache

      - name: Restore Android project archive
        run: |
          cat .source-parts/part-*.b64 | base64 --decode > Mihadril_Source.zip
          # Skip the one damaged icon entry from the text transport.
          unzip -q Mihadril_Source.zip -x 'Mihadril/icon.png'
          # Use the intact character artwork as the app portrait and launcher icon.
          sed -i "s/'icon.png'/'character.jpg'/g" Mihadril/main.py
          sed -i 's/kivy==2.3.0/kivy==2.3.2/' Mihadril/buildozer.spec
          test -f Mihadril/main.py
          test -f Mihadril/service.py
          test -f Mihadril/character.jpg
          test -f Mihadril/buildozer.spec
          grep -n "ICON_IMG\|icon.filename\|presplash.filename" Mihadril/main.py Mihadril/buildozer.spec
          ls -lah Mihadril

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 'Cython<3.4' virtualenv Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          image = Image.open('Mihadril/character.jpg').convert('RGB')
          image = ImageOps.fit(image, (512, 512), method=Image.Resampling.LANCZOS)
          image.save('Mihadril/icon.png', format='PNG', optimize=True)
          print('Generated 512x512 launcher icon')
          PY

      - name: Build debug APK
        working-directory: Mihadril
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer -v android debug
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" ../Mihadril.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mihadril-Android-APK
          path: Mihadril.apk
          if-no-files-found: error
          retention-days: 30
