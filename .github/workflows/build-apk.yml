name: Build Mihadril APK

on:
  push:
    branches: [main]
    paths:
      - ".source-parts/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihadril-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev libltdl-dev ccache

      - name: Restore Android project archive
        run: |
          cat .source-parts/part-*.b64 | base64 --decode > Mihadril_Source.zip
          # The only damaged entry in the transport archive is the launcher icon.
          # Exclude it and reconstruct a valid icon from the separate clean payload.
          unzip -q Mihadril_Source.zip -x 'Mihadril/icon.png'
          base64 --decode .source-parts/icon-64.png.b64 > Mihadril/icon.png
          python - <<'PY'
          import struct, zlib
          p = "Mihadril/icon.png"
          data = open(p, "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "launcher icon is not a PNG"
          pos = 8
          while pos < len(data):
              size = struct.unpack(">I", data[pos:pos+4])[0]
              kind = data[pos+4:pos+8]
              chunk = data[pos+4:pos+8+size]
              crc = struct.unpack(">I", data[pos+8+size:pos+12+size])[0]
              assert zlib.crc32(chunk) & 0xffffffff == crc, "PNG CRC mismatch"
              pos += 12 + size
              if kind == b"IEND":
                  break
          print("Launcher icon validated:", len(data), "bytes")
          PY
          test -f Mihadril/main.py
          test -f Mihadril/buildozer.spec
          ls -lah Mihadril

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.36 virtualenv

      - name: Build debug APK
        working-directory: Mihadril
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer -v android debug
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" ../Mihadril.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mihadril-Android-APK
          path: Mihadril.apk
          if-no-files-found: error
          retention-days: 30
